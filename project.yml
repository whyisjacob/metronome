# XcodeGen project definition for the Metronome app.
#
# Why XcodeGen: this project is authored on Windows, where Xcode cannot run and a
# hand-written .xcodeproj/project.pbxproj would be fragile and unreviewable. Instead we
# declare the project here and let a Mac (or macOS CI) materialize it:
#
#     brew install xcodegen
#     xcodegen generate
#     open Metronome.xcodeproj      # or: xcodebuild -scheme Metronome build
#
# The generated Metronome.xcodeproj is intentionally .gitignored.

name: Metronome

options:
  bundleIdPrefix: app.metronome.mobile
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  # Keep the generated project deterministic.
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    # Marketing version shown in App Store / TestFlight. Build number
    # (CURRENT_PROJECT_VERSION) is overridden per CI run — see the
    # testflight.yml workflow (BUILD_NUMBER=github.run_number).
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Placeholder Apple Team ID. No provisioning profiles are fabricated here;
    # signing is left to the Mac/CI (CI builds for the simulator, which is unsigned).
    DEVELOPMENT_TEAM: "DBGYCM8364"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    # Kept at `minimal` deliberately: the project is authored on Windows and cannot be
    # compiled locally, so we avoid `complete` strict-concurrency diagnostics we can't verify.
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  Metronome:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/Metronome
    # XcodeGen writes (and auto-excludes from the copy phase) this Info.plist from the
    # properties below, so it does not need to be hand-maintained on Windows.
    info:
      path: Sources/Metronome/App/Info.plist
      properties:
        CFBundleDisplayName: Metronome
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # A metronome uses no encryption beyond Apple-exempt OS APIs, so declare
        # export-compliance up front — this skips the manual prompt in TestFlight.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: ""
        # Background audio so the click keeps sounding when the screen locks or the app
        # is backgrounded. This is the ONLY background mode we need.
        UIBackgroundModes:
          - audio
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiredDeviceCapabilities:
          - arm64
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.metronome.mobile
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  MetronomeTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/MetronomeTests
    dependencies:
      - target: Metronome
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.metronome.mobile.tests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  Metronome:
    build:
      targets:
        Metronome: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - MetronomeTests
